# docker compose up -d   →   http://localhost:8088 (admin / admin), dashboard pronto em ~3 minutos
x-superset: &superset
  build: ./superset
  image: vb-reseller-analytics/superset:5.0.0
  environment:
    SUPERSET_CONFIG_PATH: /app/projeto/superset/superset_config.py
  volumes:
    - ./:/app/projeto:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/00_criar_banco.sql:/docker-entrypoint-initdb.d/00_criar_banco.sql:ro
    ports:
      # Para explorar os dados num cliente SQL (DBeaver, psql): localhost:5433, banco revendas, analista/analista
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d revendas"]
      interval: 5s
      retries: 20

  superset:
    <<: *superset
    command: >
      bash -c "superset db upgrade &&
               superset fab create-admin --username admin --password admin --firstname Admin --lastname Demo --email admin@example.com || true &&
               superset init &&
               /usr/bin/run-server.sh"
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/health"]
      interval: 10s
      start_period: 60s
      retries: 30

  setup:
    <<: *superset
    command: python /app/projeto/setup/run.py
    restart: "no"
    depends_on:
      superset:
        condition: service_healthy

volumes:
  pgdata:
